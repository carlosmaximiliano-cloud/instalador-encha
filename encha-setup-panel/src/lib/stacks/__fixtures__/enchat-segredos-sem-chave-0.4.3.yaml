version: "3.7"
services:

  enchat_app:
    image: ghcr.io/enchainterno/enchat-free:0.4.3
    hostname: enchat-app
    networks:
      - rede_traefik
      - enchat_net
    volumes:
      - /var/enchat/media:/data/media
    environment:
      DATABASE_URL_FILE: "/run/secrets/enchat_database_url"
      WHATSAPP_APP_SECRET: ""
      WHATSAPP_VERIFY_TOKEN: ""
      WHATSAPP_API_VERSION: "v21.0"
      INSTAGRAM_APP_ID: ""
      INSTAGRAM_APP_SECRET: ""
      INSTAGRAM_REDIRECT_URI: "https://crm.exemplo.com/api/instagram/oauth/callback"
      INSTAGRAM_VERIFY_TOKEN: ""
      INSTAGRAM_API_VERSION: "v21.0"
      PINFY_BASE_URL: "http://enchat_pinfy:3000"
      PINFY_MASTER_KEY_FILE: "/run/secrets/enchat_pinfy_master_key"
      PINFY_WEBHOOK_URL: "http://enchat_app:8080/api/webhooks/pinfy"
      PINFY_WEBHOOK_TOKEN_FILE: "/run/secrets/enchat_pinfy_webhook_token"
      PINFY_DB_PASSWORD_FILE: "/run/secrets/enchat_pinfy_db_password"
      MAUTIC_BASE_URL: ""
      MAUTIC_USER: ""
      MAUTIC_PASSWORD: ""
      MAUTIC_WEBHOOK_TOKEN: ""
      SMS_GATEWAY_ENABLED: "false"
      SMS_GATEWAY_WEBHOOK_TOKEN: ""
      WORDPRESS_WEBHOOK_TOKEN: ""
      PUBLIC_BASE_URL: "https://crm.exemplo.com"
      MEDIA_DIR: "/data/media"
      LICENSE_SERVER_URL: "https://console.enchat.pro"
      ENCHAT_CANAL: "stable"
      ENCHAT_MASTER_KEY_FILE: "/run/secrets/enchat_master_key"
      ENCHAT_SETUP_TOKEN_FILE: "/run/secrets/enchat_setup_token"
      ENCHAT_MACHINE_ID: "0123456789abcdef0123456789abcdef"
      LICENSE_KEY: ""
      TZ: "America/Sao_Paulo"
      UPDATER_URL: "http://enchat_updater:9000"
      UPDATER_TOKEN_FILE: "/run/secrets/enchat_updater_token"
      UPDATE_MODE: ""
    secrets:
      - source: enchat_master_key
        target: enchat_master_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: enchat_database_url
        target: enchat_database_url
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: enchat_pinfy_db_password
        target: enchat_pinfy_db_password
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: enchat_pinfy_master_key
        target: enchat_pinfy_master_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: enchat_pinfy_webhook_token
        target: enchat_pinfy_webhook_token
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: enchat_updater_token
        target: enchat_updater_token
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: enchat_setup_token
        target: enchat_setup_token
        uid: "1000"
        gid: "1000"
        mode: 0400
    deploy:
      replicas: 1
      update_config:
        order: start-first
      # Sem max_attempts DE PROPÓSITO (igual enchat_pinfy/enchat_postgres
      # abaixo) — o Swarm não tem depends_on com condição de saúde, então
      # num boot a frio o app precisa poder tentar reconectar ao Postgres
      # indefinidamente. Com max_attempts:5/delay:5s, uma VPS lenta o
      # bastante (~25s+ pro Postgres aceitar conexão) esgotava as tentativas
      # e derrubava a instalação de vez, sem auto-recuperação — achado em
      # teste de instalação ponta-a-ponta (2026-08-07).
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=rede_traefik"
        - "traefik.http.routers.enchat-free.rule=Host(`crm.exemplo.com`)"
        - "traefik.http.routers.enchat-free.entrypoints=websecure"
        - "traefik.http.routers.enchat-free.tls=true"
        - "traefik.http.routers.enchat-free.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.enchat-free-http.rule=Host(`crm.exemplo.com`)"
        - "traefik.http.routers.enchat-free-http.entrypoints=web"
        - "traefik.http.routers.enchat-free-http.middlewares=enchat-free-https-redirect"
        - "traefik.http.middlewares.enchat-free-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.enchat-free-https-redirect.redirectscheme.permanent=true"
        - "traefik.http.services.enchat-free.loadbalancer.server.port=8080"

  # Sidecar de atualização em um clique (docker.sock) — necessário tanto para
  # "atualizar versão" quanto para o upgrade de plano (free -> full). Sem
  # arquivo .env no host (Swarm/Portainer), então as âncoras de confiança
  # (ver repoConfiavel em cmd/enchat-updater/main.go, no repo do EnchaT) vão
  # como env var explícita — nunca escolhidas pelo Console.
  enchat_updater:
    image: ghcr.io/enchainterno/enchat-updater:0.4.3
    hostname: enchat-updater
    networks:
      - enchat_net
    # /data guarda o STATE_FILE: progresso do update em andamento (a conexão
    # de quem disparou morre junto com o app sendo trocado) e o histórico
    # de versões aplicadas que o sidecar usa para recusar versão MENOR que
    # a já aplicada. Sem volume, tudo isso sumia a cada restart do
    # contêiner. Bind no mesmo diretório que ENCHAT GRÁTIS/swarm/
    # docker-stack.yaml usa (/var/enchat/updater, criado via hostDirs).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/enchat/updater:/data
    environment:
      UPDATER_TOKEN_FILE: "/run/secrets/enchat_updater_token"
      LICENSE_SERVER_URL: "https://console.enchat.pro"
      ENCHAT_EDICAO: "free"
      ENCHAT_CANAL: "stable"
      ENCHAT_IMAGEM_PADRAO: "ghcr.io/enchainterno/enchat-free"
      ENCHAT_IMAGEM_UPGRADE: "ghcr.io/carlosmaximiliano-cloud/enchat"
      DEPLOY_MODE: "swarm"
      SWARM_SERVICE: "enchat_enchat_app"
      # Pinfy bundled: sem PINFY_SERVICE o sidecar atualiza o app e NUNCA o
      # Pinfy (README do enchat-updater), deixando os dois em versões
      # diferentes depois da primeira atualização em 1 clique. Mesmo contrato
      # de ENCHAT GRÁTIS/swarm/docker-stack.yaml, com os nomes DESTA stack:
      # o serviço é enchat_pinfy no YAML e enchat_enchat_pinfy no Swarm
      # (stack "enchat" + chave), igual ao SWARM_SERVICE do app acima.
      PINFY_SERVICE: "enchat_pinfy"
      PINFY_SWARM_SERVICE: "enchat_enchat_pinfy"
      PINFY_HEALTHZ_URL: "http://enchat_pinfy:3000/api/health"
      HEALTHZ_URL: "http://enchat_app:8080/api/healthz"
      STATE_FILE: "/data/estado.json"
    secrets:
      - source: enchat_updater_token
        target: enchat_updater_token
        uid: "0"
        gid: "0"
        mode: 0400
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  # Pinfy é nativo do EnchaT, sem licença própria — o limite de instâncias
  # por plano é entitlement do Console imposto pelo app. O hostname fixo e o
  # LICENSE_SERVER_URL abaixo são compatibilidade temporária com a imagem
  # anterior à remoção do licenciamento (ver PINFY_LICENSE_SERVER_URL).
  enchat_pinfy:
    image: ghcr.io/enchainterno/pinfy:0.4.3
    hostname: enchat-pinfy
    networks:
      - enchat_net
    environment:
      # Usuário restrito "pinfy" (papel criado pelo enchat_app no boot, S12
      # C1) — nunca mais o superusuário "enchat".
      DATABASE_URL_FILE: "/run/secrets/enchat_pinfy_database_url"
      MASTER_KEY_FILE: "/run/secrets/enchat_pinfy_master_key"
      PANEL_PASSWORD_FILE: "/run/secrets/enchat_pinfy_panel_password"
      SESSION_KEY_FILE: "/run/secrets/enchat_pinfy_session_key"
      LICENSE_SERVER_URL: "https://app.pinfy.fun"
      TZ: "America/Sao_Paulo"
    secrets:
      - source: enchat_pinfy_database_url
        target: enchat_pinfy_database_url
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: enchat_pinfy_master_key
        target: enchat_pinfy_master_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: enchat_pinfy_panel_password
        target: enchat_pinfy_panel_password
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: enchat_pinfy_session_key
        target: enchat_pinfy_session_key
        uid: "1000"
        gid: "1000"
        mode: 0400
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  enchat_postgres:
    image: pgvector/pgvector:pg16
    networks:
      - enchat_net
    volumes:
      - /var/enchat/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "enchat"
      POSTGRES_PASSWORD_FILE: "/run/secrets/enchat_postgres_password"
      POSTGRES_DB: "enchat"
    secrets:
      - source: enchat_postgres_password
        target: enchat_postgres_password
        uid: "0"
        gid: "0"
        mode: 0400
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

networks:
  rede_traefik:
    external: true
    name: rede_traefik
  enchat_net:
    driver: overlay
    attachable: true

secrets:
  enchat_master_key:
    external: true
    name: enchat_master_key_1758900000
  enchat_database_url:
    external: true
    name: enchat_database_url_1758900000
  enchat_pinfy_db_password:
    external: true
    name: enchat_pinfy_db_password_1758900000
  enchat_pinfy_master_key:
    external: true
    name: enchat_pinfy_master_key_1758900000
  enchat_pinfy_webhook_token:
    external: true
    name: enchat_pinfy_webhook_token_1758900000
  enchat_updater_token:
    external: true
    name: enchat_updater_token_1758900000
  enchat_setup_token:
    external: true
    name: enchat_setup_token_1758900000
  enchat_pinfy_database_url:
    external: true
    name: enchat_pinfy_database_url_1758900000
  enchat_pinfy_panel_password:
    external: true
    name: enchat_pinfy_panel_password_1758900000
  enchat_pinfy_session_key:
    external: true
    name: enchat_pinfy_session_key_1758900000
  enchat_postgres_password:
    external: true
    name: enchat_postgres_password_1758900000
