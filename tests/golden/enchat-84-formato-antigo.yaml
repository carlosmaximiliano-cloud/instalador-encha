version: "3.7"
services:

  enchat_app:
    # Owner separado do da edição MAX de propósito — ver
    # ENCHAT GRÁTIS/README.md no repo do EnchaT. Este caminho (menu legado
    # de secondary.sh) não é chamado por main.sh; a instalação suportada é
    # pelo painel (src/lib/stacks/enchat.ts), que resolve isso pelo Console.
    image: ghcr.io/enchainterno/enchat-free:0.4.0
    hostname: enchat-app
    networks:
      - rede_traefik
      - enchat_net
    volumes:
      - /var/enchat/media:/data/media
    environment:
      DATABASE_URL: "postgresql://enchat:SENT-postgres-pw@enchat_postgres:5432/enchat?sslmode=disable"
      WHATSAPP_APP_SECRET: ""
      WHATSAPP_VERIFY_TOKEN: ""
      WHATSAPP_API_VERSION: "v21.0"
      INSTAGRAM_APP_ID: ""
      INSTAGRAM_APP_SECRET: ""
      INSTAGRAM_REDIRECT_URI: "https://crm.exemplo.com/api/instagram/oauth/callback"
      INSTAGRAM_VERIFY_TOKEN: ""
      INSTAGRAM_API_VERSION: "v21.0"
      PINFY_BASE_URL: "http://enchat_pinfy:3000"
      PINFY_MASTER_KEY: "SENT-pinfy-master"
      PINFY_WEBHOOK_URL: "http://enchat_app:8080/api/webhooks/pinfy"
      PINFY_WEBHOOK_TOKEN: "SENT-pinfy-webhook"
      PINFY_DB_PASSWORD: "SENT-pinfy-dbpw"
      MAUTIC_BASE_URL: ""
      MAUTIC_USER: ""
      MAUTIC_PASSWORD: ""
      MAUTIC_WEBHOOK_TOKEN: ""
      SMS_GATEWAY_ENABLED: "false"
      SMS_GATEWAY_WEBHOOK_TOKEN: ""
      WORDPRESS_WEBHOOK_TOKEN: ""
      PUBLIC_BASE_URL: "https://crm.exemplo.com"
      MEDIA_DIR: "/data/media"
      LICENSE_SERVER_URL: "https://console.enchat.pro"
      ENCHAT_CANAL: "stable"
      ENCHAT_MASTER_KEY: "SENT-master-key"
      ENCHAT_SETUP_TOKEN: "SENT-setup-token"
      TZ: "America/Sao_Paulo"
      UPDATER_URL: ""
      UPDATER_TOKEN: ""
      UPDATE_MODE: ""
    deploy:
      replicas: 1
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=rede_traefik"
        - "traefik.http.routers.enchat-free.rule=Host(`crm.exemplo.com`)"
        - "traefik.http.routers.enchat-free.entrypoints=websecure"
        - "traefik.http.routers.enchat-free.tls=true"
        - "traefik.http.routers.enchat-free.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.enchat-free-http.rule=Host(`crm.exemplo.com`)"
        - "traefik.http.routers.enchat-free-http.entrypoints=web"
        - "traefik.http.routers.enchat-free-http.middlewares=enchat-free-https-redirect"
        - "traefik.http.middlewares.enchat-free-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.enchat-free-https-redirect.redirectscheme.permanent=true"
        - "traefik.http.services.enchat-free.loadbalancer.server.port=8080"

  enchat_pinfy:
    # ghcr.io/enchainterno/pinfy-api:1.0.0 era uma republicação manual
    # obsoleta (ver o comentário de pinfyRepoFrom em
    # encha-setup-panel/src/lib/stacks/enchat.ts) — o Pinfy agora é
    # vendorizado dentro do ENCHAT e publicado no MESMO CI/release do
    # enchat-free, sob "ghcr.io/enchainterno/pinfy", com a MESMA tag do app
    # (nunca mais fixo).
    image: ghcr.io/enchainterno/pinfy:0.4.0
    # COMPATIBILIDADE (temporário) — hostname fixo + LICENSE_SERVER_URL só
    # para a imagem anterior à remoção do licenciamento do Pinfy, que ainda
    # ativa licença (fingerprint sha256(machine-id + hostname); sem o
    # license-server ela cai no default morto licenca.pinfy.com.br). A imagem
    # nativa ignora as duas. Ver PINFY_LICENSE_SERVER_URL em
    # encha-setup-panel/src/lib/stacks/enchat.ts — remover nos dois lugares
    # quando a frota migrar.
    hostname: enchat-pinfy
    networks:
      - enchat_net
    environment:
      # Usuário restrito "pinfy" (papel criado pelo enchat_app no boot, S12
      # C1) — nunca mais o superusuário "enchat".
      DATABASE_URL: "postgresql://pinfy:SENT-pinfy-dbpw@enchat_postgres:5432/enchat?schema=pinfy&sslmode=disable"
      MASTER_KEY: "SENT-pinfy-master"
      PANEL_PASSWORD: "SENT-pinfy-panel"
      SESSION_KEY: "SENT-pinfy-session"
      LICENSE_SERVER_URL: "https://app.pinfy.fun"
      TZ: "America/Sao_Paulo"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  enchat_postgres:
    image: pgvector/pgvector:pg16
    networks:
      - enchat_net
    volumes:
      - /var/enchat/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "enchat"
      POSTGRES_PASSWORD: "SENT-postgres-pw"
      POSTGRES_DB: "enchat"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

networks:
  rede_traefik:
    external: true
    name: rede_traefik
  enchat_net:
    driver: overlay
    attachable: true

